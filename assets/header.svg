<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#14304a"/>
      <stop offset="1" stop-color="#1f1a10"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbbf24"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2px}
      .sub{font:500 20px 'Courier New',monospace;fill:#bae6fd;letter-spacing:3px}
      .fade{opacity:0;animation:in 1.6s ease-out .3s forwards}
      .fade2{opacity:0;animation:in 1.6s ease-out 1.1s forwards}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .scan{animation:scan 4s linear infinite}
      @keyframes scan{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
      @media (prefers-reduced-motion:reduce){.fade,.fade2{opacity:1;animation:none}.scan{animation:none;opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="120" height="260" fill="#7dd3fc" opacity="0.05"/>
  <text x="600" y="130" text-anchor="middle" class="title fade" fill="url(#txt)" filter="url(#glow)">capthusky</text>
  <text x="600" y="180" text-anchor="middle" class="sub fade2">INDUSTRIAL AUTOMATION · AI · MES / ERP</text>
</svg>
